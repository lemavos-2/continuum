name: Build Release APK Assinado

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detectar Diretório do Frontend
        id: detect-dir
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "FRONT_DIR=frontend" >> $GITHUB_ENV
            echo "ANDROID_DIR=frontend/android" >> $GITHUB_ENV
          else
            echo "FRONT_DIR=." >> $GITHUB_ENV
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
          fi

      - name: Instalar dependências e Capacitor
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/status-bar

      - name: Instalar dependências e Build Web
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm run build

      - name: Preparar icon.png (fonte dos ícones)
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          set -e

          echo "Procurando favicon/logo em todo o projeto..."

          CANDIDATOS=$(find . -type f \( -iname "favicon*.png" -o -iname "favicon*.svg" -o -iname "favicon*.ico" -o -iname "logo*.png" -o -iname "logo*.svg" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/android/*" \
            -not -path "*/ios/*" \
            -not -path "*/dist/*" \
            -not -path "*/assets/*" 2>/dev/null)

          echo "Candidatos encontrados:"
          echo "$CANDIDATOS"

          SRC=$(echo "$CANDIDATOS" | grep -iE '\.png$' | grep -iE '(^|/)public/' | head -n 1)

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.png$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.svg$' | grep -iE '(^|/)public/' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.svg$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.ico$' | grep -iE '(^|/)public/' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.ico$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            echo "ERRO: nenhum favicon/logo encontrado em lugar nenhum do repositório."
            exit 1
          fi

          echo "Usando como fonte: $SRC"

          sudo apt-get update -qq
          sudo apt-get install -y imagemagick file

          mkdir -p assets

          TIPO_REAL=$(file -b "$SRC")
          echo "Tipo real do arquivo: $TIPO_REAL"

          if echo "$TIPO_REAL" | grep -qi "icon resource"; then
            echo "É um contêiner ICO. Convertendo para PNG puro..."
            convert "$SRC[0]" -resize 1024x1024 assets/icon.png

          elif echo "$TIPO_REAL" | grep -qi "^PNG image data"; then
            echo "É um PNG puro, copiando direto."
            cp "$SRC" assets/icon.png

          else
            echo "Formato não reconhecido como PNG puro (provavelmente SVG). Convertendo..."
            convert "$SRC" -resize 1024x1024 assets/icon.png
          fi

          echo "Resultado final:"
          file assets/icon.png

      - name: Inicializar projeto Android
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          cat > capacitor.config.ts << 'EOF'
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.continuumnodes.continuum',
            appName: 'Continuum',
            webDir: 'dist',
            plugins: {
              StatusBar: {
                overlaysWebView: false,
                style: 'LIGHT',
                backgroundColor: '#000000',
              },
            },
          };

          export default config;
          EOF

          npx cap add android
          npx cap sync android

      - name: Gerar Ícones do App
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npx @capacitor/assets generate --android --assetPath assets

      - name: Corrigir Status Bar Android 15+
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "Corrigindo Status Bar para Android 15/16+..."

          MAIN_ACTIVITY="app/src/main/java/com/continuumnodes/continuum/MainActivity.java"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            MAIN_ACTIVITY=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          fi

          if [ -z "$MAIN_ACTIVITY" ] || [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          echo "MainActivity encontrada em: $MAIN_ACTIVITY"

          cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.continuumnodes.continuum;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.FrameLayout;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private View statusBarBackground;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  // Android 15+ usa edge-to-edge.
                  // O conteúdo precisa poder ficar atrás da Status Bar.
                  WindowCompat.setDecorFitsSystemWindows(window, false);

                  // A Status Bar fica transparente.
                  // A View criada abaixo será responsável pelo fundo preto.
                  window.setStatusBarColor(Color.TRANSPARENT);

                  // Remove o contraste automático que pode criar a faixa cinza.
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      window.setStatusBarContrastEnforced(false);
                  }

                  // Fundo geral da janela.
                  window.getDecorView().setBackgroundColor(Color.BLACK);

                  // Ícones/texto da Status Bar brancos.
                  WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(
                                  window,
                                  window.getDecorView()
                          );

                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                  }

                  // Container principal do Android.
                  ViewGroup decorView = (ViewGroup) window.getDecorView();

                  // View preta dedicada para cobrir EXATAMENTE a área da Status Bar.
                  statusBarBackground = new View(this);
                  statusBarBackground.setBackgroundColor(Color.BLACK);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0
                          );

                  params.gravity = Gravity.TOP;

                  decorView.addView(statusBarBackground, params);

                  // Usa WindowInsets para descobrir a altura real da Status Bar.
                  ViewCompat.setOnApplyWindowInsetsListener(
                          decorView,
                          (view, insets) -> {

                              Insets statusBars =
                                      insets.getInsets(
                                              WindowInsetsCompat.Type.statusBars()
                                      );

                              ViewGroup.LayoutParams layoutParams =
                                      statusBarBackground.getLayoutParams();

                              layoutParams.width =
                                      ViewGroup.LayoutParams.MATCH_PARENT;

                              layoutParams.height = statusBars.top;

                              statusBarBackground.setLayoutParams(layoutParams);

                              statusBarBackground.setTranslationY(0);

                              return insets;
                          }
                  );

                  // Força a aplicação inicial dos insets.
                  ViewCompat.requestApplyInsets(decorView);
              }
          }
          EOF

          echo "Status Bar corrigida."

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Permissão de execução no Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew

      - name: Build APK Release
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew assembleRelease

      - name: Decodificar e Assinar APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > keystore.jks

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$ALIAS_PASSWORD" \
            --out ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          rm keystore.jks

      - name: Upload APK (sempre, independente de tag)
        uses: actions/upload-artifact@v4
        with:
          name: continuum-release-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          retention-days: 14

      - name: Definir nome da tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Criar GitHub Release e anexar APK Assinado
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          draft: false
          prerelease: false
